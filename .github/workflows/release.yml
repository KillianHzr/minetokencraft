name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Every check of the pushes to main (three systems, three Node versions, the package test): nothing is published
  # unless all of it passes.
  check:
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing, which also signs the package's provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Trusted publishing (no npm token: npm trusts this workflow, see CONTRIBUTING.md) needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - name: Check the tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "::error::the tag is $GITHUB_REF_NAME but package.json says $version"; exit 1; fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; fi
          # A rerun after a failure further down does not publish twice.
          if [ -n "$(npm view "minetokencraft@$version" version 2>/dev/null)" ]; then echo "on-npm=true" >> "$GITHUB_OUTPUT"; fi
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish to npm
        if: steps.tag.outputs.on-npm != 'true'
        run: npm publish
      - name: GitHub release
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
